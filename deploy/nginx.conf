# 生产环境的同域反向代理示例。
#
# 🔴 **同域是 httpOnly Cookie 方案的硬性前提**（F-ADR-002）。
#
#    浏览器只访问一个源，Nginx 把 /api/ 转给 Django、其余交给静态文件。
#    全程单一源，Cookie 自动携带，**完全不需要 CORS**。
#
#    开发环境用 Vite 的 proxy 做同一件事（frontend/vite.config.ts）。
#    两边保持一致，是为了让「开发能跑、上线就 CORS 报错」这类问题不出现。

upstream django {
    server 127.0.0.1:8000;
}

server {
    listen 443 ssl http2;
    server_name rbac.example.com;

    ssl_certificate     /etc/ssl/certs/rbac.crt;
    ssl_certificate_key /etc/ssl/private/rbac.key;

    # ── SPA 静态资源 ───────────────────────────────────────────
    root /var/www/rbac/frontend/dist;

    # 带 hash 的产物可以长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ⚠️ index.html **绝不能缓存**。
    #    它是唯一引用了当前 hash 的文件；缓存住的话，
    #    发版之后用户仍然加载旧的 JS，而旧 JS 引用的
    #    chunk 已经被删了 —— 表现是「白屏 + 404」，而且刷新也不好使。
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # SPA 的 history 路由：任何未知路径都交给 index.html。
    # ⚠️ 少了这一行，用户在 /tickets/42 按 F5 会拿到 Nginx 的 404 ——
    #    前端的动态路由再对也没用，请求根本没到 JS。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── 转发给 Django ─────────────────────────────────────────
    location ~ ^/(api|django|admin|static)/ {
        proxy_pass http://django;

        # ⚠️ Host 必须原样透传。
        #    改写它（相当于 Vite 的 changeOrigin: true）会让 Django 的
        #    CSRF 校验失败——它要比对 Origin/Referer 与 Host，
        #    而报错信息完全指不到真正的原因。
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # ⚠️ 少了它，Django 会认为请求是 http 的，
        #    于是 SECURE_SSL_REDIRECT 把用户重定向到 https，
        #    Nginx 再转过来 —— **无限重定向**。
        proxy_set_header X-Forwarded-Proto $scheme;

        # 导出 CSV 可能较慢
        proxy_read_timeout 120s;
    }
}

# HTTP 一律跳 HTTPS。
# Cookie 上有 Secure 标志（prod.py 的 SESSION_COOKIE_SECURE=True），
# 走 http 的话浏览器根本不会发送它，表现为「登录了但一直 401」。
server {
    listen 80;
    server_name rbac.example.com;
    return 301 https://$host$request_uri;
}
