# 把 docs/ 构建成静态站点并发布到 GitHub Pages。
# 首次使用：仓库 Settings → Pages → Build and deployment → Source 选「GitHub Actions」。
name: docs-site

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "scripts/docs_site/**"
      - ".github/workflows/docs-site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/docs_site/requirements.txt
      - run: python scripts/docs_site/build.py --out _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
