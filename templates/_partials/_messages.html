{% if messages %}
<div class="mb-4 space-y-2">
  {% for message in messages %}
    <div class="rounded-md px-3 py-2 text-sm
      {% if message.tags == 'error' %}bg-red-50 text-red-700
      {% elif message.tags == 'warning' %}bg-amber-50 text-amber-800
      {% else %}bg-blue-50 text-blue-800{% endif %}">{{ message }}</div>
  {% endfor %}
</div>
{% endif %}
