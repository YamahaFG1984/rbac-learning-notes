{% extends "base.html" %}
{% block title %}分配角色：{{ target_user }}{% endblock %}
{% block content %}
<div class="mx-auto max-w-xl p-6">
  <h1 class="mb-1 text-xl font-semibold text-gray-900">分配角色</h1>
  <p class="mb-4 text-sm text-gray-500">
    用户：{{ target_user }}（{{ target_user.username }}）·
    多个角色的权限取<strong>并集</strong>
  </p>
  <form method="post" class="rounded-lg bg-white p-6 shadow">
    {% csrf_token %}
    <ul class="space-y-2">
      {% for role in roles %}
      <li>
        <label class="inline-flex items-start gap-2 text-sm">
          <input type="checkbox" name="roles" value="{{ role.pk }}"
                 {% if role.pk in checked %}checked{% endif %}
                 class="mt-0.5 h-4 w-4 rounded border-gray-300 text-indigo-600">
          <span>
            <span class="font-medium">{{ role.name }}</span>
            <span class="font-mono text-xs text-gray-400">{{ role.code }}</span>
            {% if role.description %}<span class="block text-xs text-gray-500">{{ role.description }}</span>{% endif %}
          </span>
        </label>
      </li>
      {% empty %}
      <li class="text-sm text-gray-400">暂无可用角色</li>
      {% endfor %}
    </ul>
    <div class="mt-6 flex gap-2">
      <button type="submit" class="rounded-md bg-indigo-600 px-3 py-1.5 text-sm font-medium text-white hover:bg-indigo-700">保存</button>
      <a href="{% url 'accounts:user_list' %}" class="rounded-md bg-white px-3 py-1.5 text-sm font-medium text-gray-700 ring-1 ring-gray-300 hover:bg-gray-50">取消</a>
    </div>
  </form>
</div>
{% endblock %}
